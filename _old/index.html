<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YogyataSetu — Form</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f7fafc; transition: background .25s, color .25s; }
    .form-wrapper { max-width:800px; margin:3rem auto; }
    .card-scheme { border:none; border-radius:12px; background:white; padding:1.2rem; }
    .card-scheme h5 { margin-bottom:0.4rem; }
    .dark-mode { background:#0b1220; color:#e6eef8; }
    .dark-mode .card-scheme { background:#0f1724; color:#dbeafe; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar navbar-light bg-white shadow-sm mt-3 mb-3 rounded">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">YOGYATASETU</a>
        <button id="darkBtn" class="btn btn-sm btn-secondary">🌙/☀️</button>
      </div>
    </nav>

    <div class="form-wrapper">
      <div class="card shadow-sm p-4 mb-4">
        <h3 class="mb-3">{{ labels.title }}</h3>
        <form id="searchForm" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Age</label>
            <input name="age" class="form-control" type="number" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
              <option value="any">Any</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Occupation</label>
            <input name="occupation" class="form-control" type="text" placeholder="e.g. farmer, student">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">{{ labels.submit }}</button>
          </div>
        </form>
      </div>

      <div id="results"></div>
    </div>
  </div>

<script>
  document.getElementById('darkBtn').addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('dark', document.body.classList.contains('dark-mode'));
  });
  if (localStorage.getItem('dark') === 'true') document.body.classList.add('dark-mode');

  document.getElementById('searchForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const form = new FormData(this);
    const res = await fetch('/search', { method: 'POST', body: form });
    const data = await res.json();
    const resultsDiv = document.getElementById('results');

    if (!data || data.length === 0) {
      resultsDiv.innerHTML = '<div class="alert alert-warning mt-3">No matching schemes found.</div>';
      return;
    }

    let html = '<div class="row g-3 mt-1">';
    data.forEach(s => {
      html += `
        <div class="col-md-6">
          <div class="card-scheme shadow-sm h-100">
            <h5>${s.name}</h5>
            <p>${s.description}</p>
            <div class="small text-muted">Age: ${s.min_age}-${s.max_age} | Gender: ${s.gender} | Occupation: ${s.occupation}</div>
          </div>
        </div>`;
    });
    html += '</div>';
    resultsDiv.innerHTML = html;
  });
</script>
</body>
</html>
