{% extends 'base.html' %}
{% block title %}{{ t('saved_title') }} · {{ t('site') }}{% endblock %}
{% block main %}
<div class="wrap">
  <div class="page-head">
    <h1>{{ t('saved_title') }}</h1>
    <p class="muted">{{ t('saved_sub') }}</p>
  </div>
  <div style="margin-top:16px;border-top:2px solid var(--line-strong)" data-saved-list data-src="{{ url_for('saved_items') }}">
    <div class="empty" data-saved-empty hidden><p>{{ t('saved_empty') }}</p><a class="btn" href="{{ url_for('find') }}">{{ t('nav_find') }}</a></div>
  </div>
</div>
{% endblock %}
